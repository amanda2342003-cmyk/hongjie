    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    // Lấy 2 quốc gia từ danh sách PREDICT_DATA theo kỳ
    function getPredictTwoCountriesForKy(kyNum) {
        if (PREDICT_DATA[kyNum]) {
            return PREDICT_DATA[kyNum];
        }
        return ["魏国", "蜀国"];
    }

    // Kiểm tra xem con giáp trúng thuộc quốc gia nào trong các quốc gia dự đoán
    function checkWinningCountry(predictedCountries, actualAnimal) {
        if (!actualAnimal) return null;
        for (let country of predictedCountries) {
            if (COUNTRY_ANIMALS[country] && COUNTRY_ANIMALS[country].includes(actualAnimal)) {
                return country;
            }
        }
        return null;
    }

    // Định dạng hiển thị 2 quốc gia, chỉ bôi vàng chữ đỏ quốc gia trúng (không bôi đậm)
    function formatCountriesWithWinningHighlight(predictedCountries, winningCountry) {
        return predictedCountries.map(country => {
            if (country === winningCountry) {
                return `<span style="background-color:yellow; color:#FF0000;">${country}</span>`;
            }
            return country;
        }).join('.');
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let valStr = String(r[7].v).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(valStr);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predictedCountries = getPredictTwoCountriesForKy(item.kyNum);
                let actualAnimal = duLieuMap[item.numTe] || '';
                let winningCountry = checkWinningCountry(predictedCountries, actualAnimal);
                let isWin = winningCountry !== null;
                evaluatedDoneList.push({ item, predictedCountries, actualAnimal, winningCountry, isWin });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            let nextKyNum = targetPredictKy;
            let predictNextArr = getPredictTwoCountriesForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);
            let predictNextStr = predictNextArr.join('.');

            let htmlNextKy = `<p style="font-size:16px;">\n${kyStrNext}期:【三国爆中】?【<span style="font-size:16px;text-wrap-mode:wrap;">${predictNextStr}</span>】开：<span style="color:#FF0000;">？00</span>准\n</p>`;

            let historyOutputs = [];

            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let entry = evaluatedDoneList[i];
                    if (entry.isWin) {
                        let resStrWin = entry.actualAnimal + entry.item.numTe;
                        let kyStr = formatThreeDigits(entry.item.kyNum);
                        
                        let formattedCountries = formatCountriesWithWinningHighlight(entry.predictedCountries, entry.winningCountry);
                        
                        historyOutputs.push(`<p style="font-size:16px;">\n${kyStr}期:【三国爆中】?【<span style="font-size:16px;text-wrap-mode:wrap;">${formattedCountries}</span>】开：<span style="color:#FF0000;">${resStrWin}</span>准\n</p>`);
                    }
                }
            }

            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let pred1 = getPredictTwoCountriesForKy(nextKyNum + 1).join('.');
                let pred2 = getPredictTwoCountriesForKy(nextKyNum + 2).join('.');
                let defaultHtml1 = `<p style="font-size:16px;">\n${kyStr1}期:【三国爆中】?【發發.發發】开：<span style="color:#FF0000;">？00</span>准\n</p>`;
                let defaultHtml2 = `<p style="font-size:16px;">\n${kyStr2}期:【三国爆中】?【發發.發發】开：<span style="color:#FF0000;">？00</span>准\n</p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let predExtra = getPredictTwoCountriesForKy(nextKyNum + 1).join('.');
                let defaultHtmlExtra = `<p style="font-size:16px;">\n${kyStrExtra}期:【三国爆中】?【發發.發發】开：<span style="color:#FF0000;">？00</span>准\n</p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
